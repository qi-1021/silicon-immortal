name: Publish source release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation generator
        run: python -m pip install Markdown==3.11.3
      - name: Prepare documentation and source archive
        run: |
          python tools/build_manual.py
          python tools/source_release.py
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish alpha source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "硅仙人 ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md --prerelease
