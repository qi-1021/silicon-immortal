name: Test source release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            label: Windows-x64
          - os: macos-15
            arch: arm64
            label: macOS-arm64
          - os: macos-15-intel
            arch: x64
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Run all tests
        run: python tools/test.py
      - name: Validate offline player guide
        run: python tools/build_manual.py
      - name: Check source launcher imports
        run: python -m compileall -q silicon_professor tools
      - name: Launch with the platform source script
        run: python tools/check_source.py
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation generator
        run: python -m pip install Markdown==3.11.3
      - name: Build source archive and checksums
        run: |
          python tools/build_manual.py
          python tools/source_release.py
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "硅仙人 ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md --prerelease
