name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            label: Windows-x64
          - os: macos-15
            arch: arm64
            label: macOS-arm64
          - os: macos-15-intel
            arch: x64
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run all tests
        run: python tools/test.py
      - name: Build offline guide and native package, then launch packaged GUI
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build source archive and checksums
        run: |
          git archive --format=zip --prefix=SiliconImmortal-source/ -o release-assets/SiliconImmortal-source.zip HEAD
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "硅仙人 ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md --prerelease
